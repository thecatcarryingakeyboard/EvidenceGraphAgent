[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-graphrag-agent"
version = "0.2.0"
description = "A LangGraph, Neo4j and GraphRAG learning project"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Open Source Contributors"}]
keywords = ["graphrag", "agent", "rag", "knowledge-graph", "enterprise-ai", "mcp"]
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]
llm = ["openai>=1.50"]
langgraph = ["langgraph>=0.3"]
neo4j = ["neo4j>=5.20", "langchain-neo4j>=0.4"]
graphrag = ["graphrag>=2.1,<3"]
dev = ["pytest>=8", "ruff>=0.6"]
all = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "openai>=1.50",
  "langgraph>=0.3",
  "neo4j>=5.20",
  "langchain-neo4j>=0.4",
  "graphrag>=2.1,<3",
  "pytest>=8",
  "ruff>=0.6",
]

[project.scripts]
enterprise-graphrag = "enterprise_graphrag.cli:main"
assistgen-agent = "enterprise_graphrag.cli:main"
evidencegraph-agent = "enterprise_graphrag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I"]
